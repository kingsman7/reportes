<div class="table-title">
  <h2>Tabla</h2>
</div>
<div class="mat-elevation-z8 table-container">
  <table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="entity">
      <th mat-header-cell *matHeaderCellDef> Entidad </th>
      <td mat-cell *matCellDef="let row"> {{row.entity}} </td>
    </ng-container>

    <ng-container matColumnDef="file">
      <th mat-header-cell *matHeaderCellDef> Expediente </th>
      <td mat-cell *matCellDef="let row"> {{row.case_file}} </td>
    </ng-container>

    <ng-container matColumnDef="movil">
      <th mat-header-cell *matHeaderCellDef> Movil </th>
      <td mat-cell *matCellDef="let row"> {{row.movil}} </td>
    </ng-container>

    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef> Lugar Del Hecho </th>
      <td mat-cell *matCellDef="let row"> {{row.location}} </td>
    </ng-container>

    <ng-container matColumnDef="observation">
      <th mat-header-cell *matHeaderCellDef> Observacion </th>
      <td mat-cell *matCellDef="let row"> {{row.observacion}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
